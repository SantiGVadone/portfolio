version: '3.8'

services:
  portfolio:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: portfolio_frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Cambiá 8080 por el puerto host que prefieras
