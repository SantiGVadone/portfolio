name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Limpiar barras finales si existen
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "Enviando ping a: ${CLEAN_URL}/rest/v1/"
          
          # Hacemos la peticion mostrando el codigo HTTP de respuesta
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X GET "${CLEAN_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Codigo de respuesta HTTP: $HTTP_STATUS"
          echo "Cuerpo de la respuesta:"
          cat response.txt
          echo ""

          # Supabase suele responder 200 si la API esta lista
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Ping exitoso!"
            exit 0
          else
            echo "Error en la conexion con Supabase"
            exit 1
          fi
