name: Supabase Keep-Alive

on:
  schedule:
    # Cada 12 horas (00:00 y 12:00 UTC).
    # Supabase pausa proyectos Free tras 7 días de baja actividad y recomienda
    # "unas pocas requests por día", así que 2 pings diarios dan margen de sobra.
    - cron: '0 0,12 * * *'
  workflow_dispatch:

# Permisos mínimos: este workflow no escribe en el repo.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validar secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::Falta el secret SUPABASE_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Falta el secret SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL="${SUPABASE_URL%/}"
          ENDPOINT="${CLEAN_URL}/rest/v1/blog_posts?select=id&limit=1"

          HTTP_STATUS=""

          for attempt in 1 2 3; do
            echo "Intento ${attempt}/3..."

            # Consultamos una tabla real para forzar una lectura en PostgreSQL.
            # Ojo: la raíz /rest/v1/ devuelve 401 con la anon key
            # ("Only the service_role API key can be used for this endpoint").
            HTTP_STATUS=$(curl -sS -o response.txt -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              -X GET "${ENDPOINT}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}") || HTTP_STATUS="000"

            echo "Codigo de respuesta: ${HTTP_STATUS}"
            cat response.txt 2>/dev/null || true
            echo ""

            # 200 (OK) o 206 (Partial Content) confirman que PostgREST y Postgres
            # atendieron la solicitud.
            if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 206 ]; then
              echo "✅ Ping exitoso: PostgreSQL respondió."
              exit 0
            fi

            # Errores que no se arreglan reintentando: damos un mensaje claro.
            if [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
              echo "::error::La anon key no puede leer blog_posts (HTTP ${HTTP_STATUS}). Revisá el secret SUPABASE_ANON_KEY y la policy RLS."
              exit 1
            fi
            if [ "$HTTP_STATUS" -eq 404 ]; then
              echo "::error::No existe la tabla blog_posts o la SUPABASE_URL es incorrecta (HTTP 404)."
              exit 1
            fi

            # 521/522/523/540: el proyecto está pausado o arrancando.
            if [ "$HTTP_STATUS" -eq 521 ] || [ "$HTTP_STATUS" -eq 522 ] || [ "$HTTP_STATUS" -eq 523 ] || [ "$HTTP_STATUS" -eq 540 ]; then
              echo "⚠️ El proyecto parece pausado o arrancando (HTTP ${HTTP_STATUS})."
            fi

            if [ "$attempt" -lt 3 ]; then
              SLEEP=$((attempt * 15))
              echo "Reintentando en ${SLEEP}s..."
              sleep "${SLEEP}"
            fi
          done

          echo "::error::Falló el ping tras 3 intentos (último código: ${HTTP_STATUS})."
          exit 1
