name: Supabase Keep-Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 12:00 UTC (más que suficiente para el margen de 7 días)
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL="${SUPABASE_URL%/}"

          # Consultamos PostgREST (/rest/v1/) para forzar lectura real en PostgreSQL
          # Si tienes una tabla específica, puedes usar "${CLEAN_URL}/rest/v1/tu_tabla?limit=1"
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X GET "${CLEAN_URL}/rest/v1/?limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Codigo de respuesta: $HTTP_STATUS"
          cat response.txt
          echo ""

          # 200 (OK), 206 (Partial Content) o 404 (Swagger/Root no listado) confirman que PostgREST y Postgres atendieron la solicitud
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 206 ] || [ "$HTTP_STATUS" -eq 404 ]; then
            echo "Ping exitoso a PostgreSQL!"
            exit 0
          else
            echo "Fallo el ping - Codigo: $HTTP_STATUS"
            exit 1
          fi
