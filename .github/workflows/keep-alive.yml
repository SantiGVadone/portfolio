name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL="${SUPABASE_URL%/}"

          # Usamos /auth/v1/health que acepta peticiones publicas y mantiene el proyecto activo
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X GET "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Codigo de respuesta: $HTTP_STATUS"
          cat response.txt
          echo ""

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Ping exitoso!"
            exit 0
          else
            echo "Fallo el ping"
            exit 1
          fi
